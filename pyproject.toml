[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmusic-desktop"
version = "0.1.0"
description = "A native Telegram music desktop player built with PySide6 and TDLib"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "AmiiirCom" }
]
dependencies = [
    "PySide6>=6.8.0",
    "cryptography>=43.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]